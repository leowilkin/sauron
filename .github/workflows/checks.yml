# Tests, and a version bump for anything that ships to users' computers. Claude Code installs the plugin by
# its version, so a change to the hooks or tracker without a new version never reaches anyone.
name: checks
on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.txt
      - run: python -m unittest discover -s tests

  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Plugin version goes up when shipped files change
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git diff --name-only "$BASE" HEAD | grep -qE '^(tracker|hooks|bin|\.claude-plugin)/'; then
            echo "No plugin files changed."; exit 0
          fi
          old=$(git show "$BASE:.claude-plugin/plugin.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          new=$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          python3 - "$old" "$new" <<'EOF'
          import sys
          old, new = (tuple(int(x) for x in v.split(".")) for v in sys.argv[1:])
          if new <= old:
              sys.exit("tracker/, hooks/ or bin/ changed, but .claude-plugin/plugin.json is still %s. "
                       "Bump its version so Claude Code installs the update." % sys.argv[1])
          print("Version %s -> %s" % tuple(sys.argv[1:]))
          EOF
